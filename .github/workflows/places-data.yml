name: Halal Maps open data

# Monthly: rebuild the place files from the latest Overture Maps release and
# publish them on the places-data branch. The API notices a newer file within
# a day and imports it (with its sync-safety check). No secrets needed.
on:
  schedule:
    - cron: "17 9 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.1.3
      - name: Build place files
        run: cd scripts && python places_data.py places_areas.json ../out
      - name: Publish to the places-data branch
        run: |
          mkdir publish && cd publish && git init -q -b places-data
          git config user.name "tayyib-bot"
          git config user.email "actions@users.noreply.github.com"
          cp ../out/*.json .
          printf '%s\n' "Place files for Halal Maps, rebuilt monthly from Overture Maps (overturemaps.org)." "Generated by .github/workflows/places-data.yml. Do not edit by hand." > README.md
          git add . && git commit -q -m "Place files $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" places-data
      - name: Tell the API there are new files
        # Opening the map makes the API look for newer place files and import them.
        run: |
          python - <<'PY'
          import json, urllib.request
          for area in json.load(open("scripts/places_areas.json"))["areas"]:
              s, w, n, e = area["bbox"]
              url = f"https://tayyib-backend.onrender.com/restaurants/nearby?lat={(s+n)/2:.4f}&lng={(w+e)/2:.4f}&radius_km=8"
              try:
                  with urllib.request.urlopen(url, timeout=120) as r:
                      print(area["scope"], r.status, len(json.load(r).get("items", [])), "places near its centre")
              except Exception as exc:
                  print(area["scope"], "API not reachable right now:", exc)
          PY
