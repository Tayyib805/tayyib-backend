name: API check

# Manual. Calls the live API's public endpoints and prints what came back,
# so a deploy can be checked from anywhere. Reads only; changes nothing.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the API
        run: |
          python - <<'PY'
          import collections, json, os, time, urllib.error, urllib.request
          BASE = "https://tayyib-backend.onrender.com"
          lines = ["# API check", ""]
          def get(path, timeout=120):
              started = time.time()
              try:
                  with urllib.request.urlopen(BASE + path, timeout=timeout) as r:
                      return r.status, json.load(r), time.time() - started
              except urllib.error.HTTPError as e:
                  return e.code, {"error": e.read().decode()[:300]}, time.time() - started
              except Exception as e:
                  return 0, {"error": str(e)}, time.time() - started
          code, body, t = get("/")
          lines.append(f"- `/` {code} in {t:.1f}s")
          code, body, t = get("/config")
          lines.append(f"- `/config` {code}: {json.dumps(body)[:400]}")
          for label, lat, lng in [("Anaheim", 33.8353, -117.9145), ("Paterson NJ", 40.9168, -74.1718), ("Chicago", 41.9979, -87.6903), ("Dearborn MI", 42.3223, -83.1763), ("Houston", 29.7174, -95.4962), ("Toronto", 43.6532, -79.3832), ("Rural Nevada (covered, empty)", 39.5, -116.5), ("London (not covered)", 51.5155, -0.0722)]:
              for attempt in range(4):
                  code, body, t = get(f"/restaurants/nearby?lat={lat}&lng={lng}&radius_km=16")
                  if body.get("osm") != "loading":
                      break
                  time.sleep(10)
              items = body.get("items", [])
              tiers = dict(collections.Counter(i.get("tier") for i in items))
              lines.append(f"- nearby {label}: {code} in {t:.1f}s, osm={body.get('osm')}, {len(items)} places, tiers {tiers}")
              for i in items[:5]:
                  lines.append(f"    - {i['name']} · {i.get('distance_km')} km · {i.get('tier')} · {i.get('halal_level')}")
          for text in ("chic", "montreal", "pater"):
              code, body, t = get(f"/restaurants/cities?q={text}")
              lines.append(f"- cities starting with '{text}': {code}, " + "; ".join(f"{c['label']} ({c['places']})" for c in body.get("items", [])[:4]))
          code, body, t = get("/restaurants/admin/review")
          lines.append(f"- admin queue without signing in: {code} (expected 401)")
          code, body, t = get("/leaderboard/scans?period=all")
          lines.append(f"- leaderboard: {code}, {len(body.get('entries', []))} entries")
          # The app looks a barcode up from the shopper's device when the server's budget is spent:
          # that only works if Open Food Facts allows requests from web pages (CORS).
          def cors(label, url, origin="https://tayyib.app"):
              try:
                  req = urllib.request.Request(url, headers={"Origin": origin, "User-Agent": "tayyib-api-check/1.0"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      lines.append(f"- {label}: {r.status}, Access-Control-Allow-Origin = {r.headers.get('Access-Control-Allow-Origin')!r}")
              except urllib.error.HTTPError as e:
                  lines.append(f"- {label}: {e.code}, Access-Control-Allow-Origin = {e.headers.get('Access-Control-Allow-Origin')!r}")
              except Exception as e:
                  lines.append(f"- {label}: failed ({e})")
          cors("Open Food Facts from a web page", "https://world.openfoodfacts.org/api/v2/product/737628064502.json?fields=code,product_name&app_name=tayyib")
          cors("our API from another website", BASE + "/config", origin="https://example.org")
          text = "\n".join(lines)
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(text + "\n")
          PY
